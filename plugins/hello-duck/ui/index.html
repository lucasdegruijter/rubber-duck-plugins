<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Hello Duck</title>
    <style>
      :root { color-scheme: light dark; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: system-ui, -apple-system, sans-serif;
        background: #faf9f5;
        color: #1a1a1a;
      }
      .card { text-align: center; padding: 2rem; }
      .duck { font-size: 4rem; }
      h1 { margin: 0.5rem 0 0.25rem; font-size: 1.25rem; }
      p { margin: 0; color: #666; font-size: 0.9rem; }
    </style>
  </head>
  <body>
    <main class="card">
      <div class="duck">🦆</div>
      <h1>Hello, Duck!</h1>
      <p>This is the example plugin UI, served over <code>plugin://</code>.</p>
    </main>
  </body>
</html>
